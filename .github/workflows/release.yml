# Release: läuft, sobald ein Versions-Tag (z. B. v1.1.0) gepusht wird.
#  1. Tests
#  2. Docker-Image für x86 und ARM bauen und nach ghcr.io hochladen
#  3. Die neue Version in deploy/portainer.yml eintragen und auf main pushen.
#     Portainer sieht diese Änderung und rollt die Version aus.
name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  packages: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
      version: ${{ steps.name.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ideenraum" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ steps.name.outputs.version }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.name.outputs.version }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Neue Version in den Portainer-Stack eintragen
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          sed -i -E "s#^([[:space:]]*image:[[:space:]]*).*/ideenraum:.*#\1${IMAGE}:${VERSION}#" deploy/portainer.yml
          grep -n "image:" deploy/portainer.yml
          if git diff --quiet; then echo "Stack ist schon auf ${VERSION}"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Portainer: Ideenraum ${VERSION} ausrollen"
          git push origin HEAD:main
