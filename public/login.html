<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anmelden · Ideenraum</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<script type="module" src="login.js"></script>
</head>
<body class="login-page">
  <main class="panel login-card">
    <svg viewBox="0 0 24 24" width="34" height="34" fill="none" aria-hidden="true">
      <rect x="8" y="9" width="8" height="6" rx="2.2" fill="var(--accent)"/>
      <path d="M16 12c2.2 0 2.4-5 4.6-5M16 12c2.2 0 2.4 5 4.6 5M8 12c-2.2 0-2.4-5-4.6-5M8 12c-2.2 0-2.4 5-4.6 5" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
    <h1>Ideenraum</h1>
    <p>Gib das Passwort ein, um deine Boards zu öffnen.</p>
    <form id="loginForm">
      <label for="pw">Passwort</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
      <p class="login-err" id="err" role="alert" hidden></p>
      <button class="btn primary" type="submit">Anmelden</button>
    </form>
  </main>
</body>
</html>
